<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Confeitaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/logo-chuleta.png">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="marca">
                <span class="marca-icone"><img src="/logo-chuleta.png" alt=""></span>
                <div>
                    <strong id="empresa-nome">ERP Confeitaria</strong>
                    <small id="empresa-slogan">carregando...</small>
                </div>
            </div>
            <nav id="menu">
               <button class="nav-item ativo" data-tela="dashboard"><span class="icone">dashboard</span> Dashboard</button>
                <button class="nav-item" data-tela="pdv"><span class="icone">shopping_cart</span> Nova venda</button>
                <button class="nav-item" data-tela="vendas"><span class="icone">receipt_long</span> Vendas</button>
                <button class="nav-item" data-tela="produtos"><span class="icone">bakery_dining</span> Produtos</button>
                <button class="nav-item" data-tela="receitas"><span class="icone">menu_book</span> Receitas</button>
                <button class="nav-item" data-tela="ingredientes"><span class="icone">egg_alt</span> Ingredientes</button>
                <button class="nav-item" data-tela="estoque"><span class="icone">inventory_2</span> Estoque</button>
                <button class="nav-item" data-tela="clientes"><span class="icone">group</span> Clientes</button>
                <button class="nav-item" data-tela="financeiro"><span class="icone">payments</span> Financeiro</button>
                <button class="nav-item" data-tela="configuracoes"><span class="icone">settings</span> Configurações</button>
                <a class="nav-item" href="analytics/index.html"><span class="icone">trending_up</span> Analytics</a>
            </nav>
            <div class="status-api" id="status-api">conectando...</div>
        </aside>

        <main class="conteudo">
            <header class="topo">
                <h1 id="titulo-tela">Dashboard</h1>
                <div id="acoes-tela" class="acoes-tela"></div>
            </header>
            <section id="tela" class="tela"></section>
        </main>
    </div>

    <div class="modal-fundo" id="modal-fundo" hidden>
        <div class="modal">
            <header>
                <h2 id="modal-titulo">Título</h2>
                <button class="fechar" onclick="fecharModal()">&times;</button>
            </header>
            <div id="modal-corpo"></div>
        </div>
    </div>

    <div id="avisos" class="avisos"></div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
