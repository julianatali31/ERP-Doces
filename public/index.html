<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Confeitaria</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="marca">
                <span class="marca-icone">🍪</span>
                <div>
                    <strong id="empresa-nome">ERP Confeitaria</strong>
                    <small id="empresa-slogan">carregando...</small>
                </div>
            </div>
            <nav id="menu">
                <button class="nav-item ativo" data-tela="dashboard"><span>📊</span> Dashboard</button>
                <button class="nav-item" data-tela="pdv"><span>🛒</span> Nova venda</button>
                <button class="nav-item" data-tela="vendas"><span>🧾</span> Vendas</button>
                <button class="nav-item" data-tela="produtos"><span>🧁</span> Produtos</button>
                <button class="nav-item" data-tela="receitas"><span>📖</span> Receitas</button>
                <button class="nav-item" data-tela="ingredientes"><span>🥣</span> Ingredientes</button>
                <button class="nav-item" data-tela="estoque"><span>📦</span> Estoque</button>
                <button class="nav-item" data-tela="clientes"><span>👥</span> Clientes</button>
                <button class="nav-item" data-tela="financeiro"><span>💰</span> Financeiro</button>
                <button class="nav-item" data-tela="configuracoes"><span>⚙️</span> Configurações</button>
                <a class="nav-item" href="analytics/index.html"><span>📈</span> Analytics</a>
            </nav>
            <div class="status-api" id="status-api">conectando...</div>
        </aside>

        <main class="conteudo">
            <header class="topo">
                <h1 id="titulo-tela">Dashboard</h1>
                <div id="acoes-tela" class="acoes-tela"></div>
            </header>
            <section id="tela" class="tela"></section>
        </main>
    </div>

    <div class="modal-fundo" id="modal-fundo" hidden>
        <div class="modal">
            <header>
                <h2 id="modal-titulo">Título</h2>
                <button class="fechar" onclick="fecharModal()">&times;</button>
            </header>
            <div id="modal-corpo"></div>
        </div>
    </div>

    <div id="avisos" class="avisos"></div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
